<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>像素贪吃蛇</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    background: #232741;
    background-image: repeating-conic-gradient(#262b47 0% 25%, #232741 0% 50%);
    background-size: 16px 16px;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px; box-sizing: border-box;
    font-family: 'Courier New', monospace;
    user-select: none;
    overscroll-behavior: none;   /* 手机上禁止下拉刷新/回弹 */
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    box-shadow: 0 0 0 4px #0d0f18, 0 0 0 8px #3a4163, 0 14px 48px rgba(0,0,0,.6);
    touch-action: none;          /* 触屏手势交给游戏处理, 禁止浏览器缩放/滚动 */
    -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';
/* ================= 常量与资源 ================= */
const GRID = 27, CELL = 26, HUD = 64;
const isTouch = ('ontouchstart' in window) || (navigator && navigator.maxTouchPoints > 0);
const W = GRID * CELL;
const GRID_END = HUD + GRID * CELL;        // 地图底边
const DPAD_H = isTouch ? 176 : 0;          // 触屏: 地图下方独立方向键区高度
const H = GRID_END + DPAD_H;
const CX = W / 2;                         // 画布水平中心(界面居中用)
const START = {x: 13, y: 13};            // 出生点(地图中心)
const SAFE_R = 5;                         // 初始布局: 出生点安全区半径(不生成墙)
const TICK_MS = 170;                      // 蛇每步间隔(0.17秒/格)
const WALL_COUNT = 6, WALL_MIN = 4, WALL_MAX = 15;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const DPR = window.devicePixelRatio || 1;
canvas.width = W * DPR;      // 高分屏: 按设备像素渲染, 文字与图形都清晰
canvas.height = H * DPR;
ctx.scale(DPR, DPR);
ctx.imageSmoothingEnabled = false;
// 窗口较小时等比缩小画布, 避免顶部被裁掉
function fitCanvas() {
  const s = Math.min(1, (window.innerWidth - 24) / W, (window.innerHeight - 24) / H);
  canvas.style.width = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

const HEAD_SPRITE = new Image(); HEAD_SPRITE.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABoAAAAaCAYAAACpSkzOAAABxElEQVR4nGNgIBP8/nz5PwgTq56RFMMfXpqCYfD/bzcYGLk0wGx5vRxGii0CWQIyFB9g5NLAaRkTqZaADHv3XgarOpAabL4G6yPFkquHzjD85VGAyylJItzJIynE8OX5OzCNzWcEfQSyBGQACMurKjEwf3mAV72CxRTGi0eOYIizEPLN57vHUMRAliEDkA9AAOabTdMisAYdTh/hCmsY0AlcxgjCl869AVsCsww5OAlaBMsfuFIZyAIY2y9rBeOL704MIFxUuZPh3vN/DDKKBoSDDmTJs/sH4XFDDHCJSgFbbCjNA3agro03AwNDBW4fkWMJMjj/9AsjKOhYeXUxUjMTcpzALCEXGErz/P/FoYdVjgk54om15Mr6qP9lER7/YUEFA3Pn1DCw/biE3SJSLXl4+x6YjgsXYhDlZWcAWeimIfz/3PaO/7gsAQHGBydysCZjfHEEswyUp0CpDASQkzWvshVxJQOhhAArhkAWYispYGUecjXCgm4oLKfjAxDXo5YQ2Cx7dh+Pj8hJ1rjMAFkGijuiqwlSAQ9SqAgJPgEHIwstLfkCD51jDCzIKYgYAMuQwtI8WOWRswnIbGLNHQUjCAAAeEf8kaL1cVAAAAAASUVORK5CYII=';
const FOOD_SPRITE = new Image(); FOOD_SPRITE.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABoAAAAaCAYAAACpSkzOAAABm0lEQVR4nGNkwAG+fTzx/9OryxjifGK6DFz8FowMJAIUDS9uz/4Potk+7iSo8Re/O0mWMiJbQowF2CyUUE0laBkjKIh+3O5hoBQImazBaxnjuzMh4OBCB/9+3MVrMBOHMkmWMSFzVl+8CMaELEFWiwxwORrFot+vTjMcvfqN4d4/E4a1N7/gtaTpxA+GAMlfYLUwh8Ech8syJpgCca+HjIv6njI+v36IoG9g6jtTlzNefc/C8PfTOzBGT71YfRRXJA2XDFbnwWkByMAPzz7B+chsmKOxpV7GN0cM/8MMmL3/EUOqoxxYgplPCCXSQYYgu3r2/kdgGqYepgc5kSAnDhSL0MHtR6oofFW52zh9is0y5DzGwoAHEGMwPoAchEy4fEMu+PvpHUr2gCUMJuT4oCVgooWhf5FCCBZ8cIuo7at/aMFHNR8xozkU3VcoFpHrK2aoPnT9oGINBljQMyVIMamp8C8R6plAliAXiuQkdWY+IThGBzBfwQtVbJqRaXzgL7RQxedIxpfb5P/jMoyaGZmF2gbSNcMyjAiLAPLE2v48BGTvAAAAAElFTkSuQmCC';
let headOk = false, foodOk = false;
HEAD_SPRITE.onload = () => headOk = true;
// 绿色奶蛋: 食物精灵染成绿色(保留明暗纹理)
const greenFoodCanvas = document.createElement('canvas');
greenFoodCanvas.width = CELL; greenFoodCanvas.height = CELL;
const gctx = greenFoodCanvas.getContext('2d');
gctx.imageSmoothingEnabled = false;
FOOD_SPRITE.onload = () => {
  foodOk = true;
  gctx.drawImage(FOOD_SPRITE, 0, 0, CELL, CELL);
  gctx.globalCompositeOperation = 'source-in';
  gctx.fillStyle = 'rgba(74,222,106,0.88)';
  gctx.fillRect(0, 0, CELL, CELL);
  gctx.globalCompositeOperation = 'source-over';
};

/* 绿色奶蛋: 15%概率出现, 0.4s/格随机游走(避开墙与蛇身), 6.5秒消失, 吃到回1血(满血则加长) */
const GREEN_EGG_P = 0.15;            // 每次吃奶蛋的刷新概率
const GREEN_EGG_MOVE_MS = 400;       // 游走速度(0.4秒/格, 比蛇慢得多)
const GREEN_EGG_LIFE_MS = 6500;      // 存活时间

/* 背景音乐与音量 */
const bgm = new Audio('bgm.mp3');
bgm.loop = true;
const sfxHit = new Audio('hit.mp3');   // 扣血/游戏结束
const sfxEat = [new Audio('eat1.mp3'), new Audio('eat2.mp3'), new Audio('eat3.mp3')];
const sfxHeal = new Audio('heal.mp3'); // 吃绿色奶蛋回血
let vol = 1, volMuted = false, bgmStarted = false;
function applyVol() {
  const v = volMuted ? 0 : vol;
  bgm.volume = v;
  sfxHit.volume = v;
  sfxHeal.volume = v;
  for (const a of sfxEat) a.volume = v;
}
function playSfx(a) {                   // 从头播放(允许连续触发)
  try {
    a.currentTime = 0;
    const p = a.play();
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}
function toggleMute() { volMuted = !volMuted; applyVol(); }
function setVolFromX(x) {
  const b = curVolRects.bar;
  const t = Math.min(1, Math.max(0, (x - b.x) / b.w));
  vol = Math.round(t * 4) / 4;      // 0 / 0.25 / 0.5 / 0.75 / 1
  volMuted = false;
  applyVol();
}
function ensureBgm() {               // 浏览器要求用户手势后才能播放, 在点击开始时启动
  if (bgmStarted) return;
  bgmStarted = true;
  const p = bgm.play();
  if (p && p.catch) p.catch(() => { bgmStarted = false; });
}
applyVol();

const DIRS = { up: [0,-1], down: [0,1], left: [-1,0], right: [1,0] };
const KEYMAP = { ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
                 ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right' };

/* 像素爱心 7x6 点阵 */
const HEART = ['0110110','1111111','1111111','0111110','0011100','0001000'];

/* ================= 游戏状态 ================= */
let mode = 'start';                       // start | play | pause | over
let snake, dir, queue, walls, food;
let greenEgg = null;                      // 绿色奶蛋 { x, y, spawnT, moveT }
let hp = 3, score = 0, timeMs = 0;
let acc = 0, lastT = 0, respawnUntil = 0;
let shakeUntil = 0, flash = 0, fx = [];
let wallFxT = -1e9;                        // 墙体最近一次重布局的时间(用于闪烁提示)
let heartPop = [0, 0, 0];
let hoverBtn = null, curVolRects = null;
let ptrDown = null, dpadPressed = null, suppressClickUntil = 0, resumeOnUp = false;

const pauseBtn = { x: 8, y: 0, w: 64, h: 64 };          // 放大触控区
const startBtn = { x: CX - 130, y: 372, w: 260, h: 72 };
const restartBtn = { x: CX - 130, y: 508, w: 260, h: 72 };
// 触屏虚拟方向键: 地图下方独立区域内, 标准十字(上居中, 下排左/下/右, 键间留8px缝)
const dpad = isTouch ? {
  up:    { x: CX - 38,  y: GRID_END + 10, w: 76, h: 76 },
  down:  { x: CX - 38,  y: GRID_END + 90, w: 76, h: 76 },
  left:  { x: CX - 122, y: GRID_END + 90, w: 76, h: 76 },
  right: { x: CX + 46,  y: GRID_END + 90, w: 76, h: 76 },
} : null;

function pushDir(d) {                     // 方向输入(键盘/滑动/虚拟键共用)
  // 撞墙重生无敌期内忽略转向, 保证先沿原方向安全前进(前方3格无墙)
  if (mode === 'play' && performance.now() > respawnUntil && queue.length < 3) queue.push(d.slice());
}

function resetSnake() {
  snake = [[START.x, START.y], [START.x - 1, START.y], [START.x - 2, START.y]];
  dir = DIRS.right.slice(); queue = [];
}

function genWalls(forbidden) {
  walls = new Set();
  const forbid = forbidden ? new Set(forbidden) : new Set();
  // 仅初始布局(未传禁放区)时保留出生点安全区; 重布局时以"蛇身+前方3格"为准
  if (!forbidden) {
    for (let y = Math.max(0, START.y - SAFE_R); y <= Math.min(GRID - 1, START.y + SAFE_R); y++) {
      for (let x = Math.max(0, START.x - SAFE_R); x <= Math.min(GRID - 1, START.x + SAFE_R); x++) {
        forbid.add(x + ',' + y);
      }
    }
  }
  for (let i = 0; i < WALL_COUNT; i++) {
    let placed = false;
    for (let att = 0; att < 400 && !placed; att++) {
      const horiz = Math.random() < 0.5;
      const len = WALL_MIN + Math.floor(Math.random() * (WALL_MAX - WALL_MIN + 1));
      let x = 2 + Math.floor(Math.random() * (GRID - 4));
      let y = 2 + Math.floor(Math.random() * (GRID - 4));
      if (horiz && x + len - 1 > GRID - 3) continue;
      if (!horiz && y + len - 1 > GRID - 3) continue;
      let ok = true; const cells = [];
      for (let j = 0; j < len; j++) {
        const cx = horiz ? x + j : x, cy = horiz ? y : y + j;
        const key = cx + ',' + cy;
        if (forbid.has(key)) { ok = false; break; }
        if (walls.has(key)) { ok = false; break; }
        cells.push(key);
      }
      if (ok) { cells.forEach(c => walls.add(c)); placed = true; }
    }
  }
}

function regenWalls() {
  // 吃食物/重生时重布局: 避开整条蛇身 + 当前行进方向的前 3 格 + 食物所在格
  const forbid = new Set();
  for (const s of snake) forbid.add(s[0] + ',' + s[1]);
  if (food) forbid.add(food.x + ',' + food.y);
  if (greenEgg) forbid.add(greenEgg.x + ',' + greenEgg.y);
  const [hx, hy] = snake[0];
  for (let i = 1; i <= 3; i++) {
    // 前方3格也按传送规则换算(出界绕到对侧)
    const ax = (hx + dir[0] * i + GRID) % GRID, ay = (hy + dir[1] * i + GRID) % GRID;
    forbid.add(ax + ',' + ay);
  }
  genWalls(forbid);
  wallFxT = performance.now();
}

function spawnFood() {
  const free = [];
  for (let y = 0; y < GRID; y++) for (let x = 0; x < GRID; x++) {
    if (walls.has(x + ',' + y)) continue;
    if (snake.some(s => s[0] === x && s[1] === y)) continue;
    if (greenEgg && greenEgg.x === x && greenEgg.y === y) continue;
    free.push([x, y]);
  }
  if (!free.length) { mode = 'over'; return; }
  const c = free[Math.floor(Math.random() * free.length)];
  food = { x: c[0], y: c[1] };
}

function spawnGreenEgg() {
  const free = [];
  for (let y = 0; y < GRID; y++) for (let x = 0; x < GRID; x++) {
    if (walls.has(x + ',' + y)) continue;
    if (snake.some(s => s[0] === x && s[1] === y)) continue;
    if (food && food.x === x && food.y === y) continue;
    free.push([x, y]);
  }
  if (!free.length) return;
  const c = free[Math.floor(Math.random() * free.length)];
  const now = performance.now();
  greenEgg = { x: c[0], y: c[1], spawnT: now, moveT: now };
}

function moveGreenEgg() {
  const options = [];
  for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
    const nx = greenEgg.x + dx, ny = greenEgg.y + dy;
    if (nx < 0 || ny < 0 || nx >= GRID || ny >= GRID) continue;  // 不穿边缘
    if (walls.has(nx + ',' + ny)) continue;                      // 不撞墙
    if (snake.some(s => s[0] === nx && s[1] === ny)) continue;   // 不踩蛇身
    options.push([nx, ny]);
  }
  if (options.length) {
    const c = options[Math.floor(Math.random() * options.length)];
    greenEgg.x = c[0]; greenEgg.y = c[1];
  }
}

function initWorld() { genWalls(); resetSnake(); spawnFood(); }

/* ================= 流程控制 ================= */
function startGame() {
  mode = 'play'; hp = 3; score = 0; timeMs = 0; acc = 0;
  resetSnake(); respawnUntil = 0; fx = []; flash = 0; heartPop = [0,0,0];
  greenEgg = null;
  spawnFood();
  ensureBgm();                 // 点击开始 = 用户手势, 此时启动背景音乐
}
function restartGame() { initWorld(); startGame(); }
function pauseGame() { mode = 'pause'; }
function resumeGame() { mode = 'play'; }

/* ================= 逻辑 ================= */
function tick() {
  while (queue.length) {
    const d = queue.shift();
    if (!(d[0] + dir[0] === 0 && d[1] + dir[1] === 0)) { dir = d; break; }
  }
  let nx = snake[0][0] + dir[0], ny = snake[0][1] + dir[1];
  // 地图边缘传送: 出界后从对侧进入(下出上进/左出右进)
  let wrapped = false;
  if (nx < 0) { nx = GRID - 1; wrapped = true; }
  else if (nx >= GRID) { nx = 0; wrapped = true; }
  if (ny < 0) { ny = GRID - 1; wrapped = true; }
  else if (ny >= GRID) { ny = 0; wrapped = true; }
  const eating = food && nx === food.x && ny === food.y;
  const eatingGreen = greenEgg && nx === greenEgg.x && ny === greenEgg.y;
  if (walls.has(nx + ',' + ny)) { onHit(); return; }
  const bodyLen = eating ? snake.length : snake.length - 1;
  for (let i = 0; i < bodyLen; i++) {
    if (snake[i][0] === nx && snake[i][1] === ny) { onHit(); return; }
  }
  snake.unshift([nx, ny]);
  if (wrapped) fx.push({ x: nx, y: ny, t0: performance.now() });   // 传送入口提示圈
  let grew = false;
  if (eatingGreen) {                              // 吃绿色奶蛋: 回血+音效; 满血时改为加一格长度
    if (hp < 3) hp++;
    else grew = true;
    playSfx(sfxHeal);
    fx.push({ x: nx, y: ny, t0: performance.now(), color: 'rgba(74,222,106,#A)' });
    greenEgg = null;
  }
  if (eating) {
    score++;
    fx.push({ x: nx, y: ny, t0: performance.now() });
    playSfx(sfxEat[Math.floor(Math.random() * sfxEat.length)]);   // 随机三选一
    regenWalls();          // 墙体重新布局(避开蛇身与前方3格)
    spawnFood();
    if (Math.random() < GREEN_EGG_P) spawnGreenEgg();   // 15%概率刷新绿色奶蛋
  } else if (!grew) snake.pop();
}

function onHit() {
  hp--;
  playSfx(sfxHit);          // 扣血音效(含最后一次导致游戏结束的扣血)
  if (hp >= 0 && hp < 3) heartPop[hp] = performance.now();
  shakeUntil = performance.now() + 300;
  flash = 1;
  if (hp <= 0) { mode = 'over'; return; }
  // 原地重生: 长度变为损失前的 65%(向下取整, 最少保留 1 格), 超过 30 则固定为 20
  const preLen = snake.length;
  const newLen = preLen > 30 ? 20 : Math.max(1, Math.floor(preLen * 0.65));
  snake = snake.slice(0, newLen);
  queue = [];                // 清空排队的方向指令, 保持原方向前进, 防止撞向新生成的侧墙
  regenWalls();                            // 墙体重新布局(避开蛇身与前方3格)
  respawnUntil = performance.now() + 900;  // 重生无敌闪烁期
}

/* ================= 绘制工具(文字使用系统字体, 清晰优先) ================= */
const FONT_STACK = '"Microsoft YaHei","PingFang SC","Noto Sans SC","SimHei",sans-serif';
function setFont(s, bold) {
  ctx.font = (bold ? 'bold ' : '') + Math.round(12 * s) + 'px ' + FONT_STACK;
}
function drawText(txt, x, y, s, color, align, bold) {
  setFont(s, bold);
  ctx.fillStyle = color;
  ctx.textBaseline = 'top';
  ctx.textAlign = align === 'center' ? 'center' : (align === 'right' ? 'right' : 'left');
  ctx.fillText(txt, x, y);
  ctx.textAlign = 'left';
}
function drawTextShadow(txt, x, y, s, color, align, bold) {
  drawText(txt, x + 2, y + 2, s, 'rgba(13,15,24,0.85)', align, bold);
  drawText(txt, x, y, s, color, align, bold);
}

function drawBtnRect(b, hover) {
  ctx.fillStyle = '#0d0f18'; ctx.fillRect(b.x + 4, b.y + 4, b.w, b.h);
  ctx.fillStyle = hover ? '#46507a' : '#38405c';
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.fillStyle = hover ? '#a9b4d8' : '#8b97b8';
  ctx.fillRect(b.x, b.y, b.w, 4); ctx.fillRect(b.x, b.y, 4, b.h);
  ctx.fillStyle = hover ? '#232a45' : '#141828';
  ctx.fillRect(b.x, b.y + b.h - 4, b.w, 4); ctx.fillRect(b.x + b.w - 4, b.y, 4, b.h);
}
function drawBtn(b, label, s, accent, hover) {
  drawBtnRect(b, hover);
  setFont(s, true);
  ctx.fillStyle = accent ? '#eaffee' : '#f2f5ff';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  ctx.fillText(label, b.x + b.w / 2, b.y + b.h / 2 + 1);
  ctx.textAlign = 'left';
}

/* ================= 音量控件 ================= */
function volRects(y) {
  const x0 = CX - 172;
  return {
    label: { x: x0, y: y - 2, w: 48, h: 24 },
    bar:   { x: x0 + 56, y: y + 4, w: 240, h: 14 },
    mute:  { x: x0 + 304, y: y - 8, w: 40, h: 40 },
  };
}
function drawSpeaker(b, muted) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  ctx.fillStyle = '#e8ecff';
  ctx.fillRect(cx - 10, cy - 6, 4, 12);          // 喇叭箱体
  ctx.fillRect(cx - 6, cy - 4, 3, 8);            // 锥形
  ctx.fillRect(cx - 3, cy - 2, 2, 4);
  if (!muted) {
    if (vol >= 0.25) ctx.fillRect(cx + 3, cy - 3, 2, 6);   // 声波一
    if (vol >= 0.75) ctx.fillRect(cx + 7, cy - 5, 2, 10);  // 声波二
  } else {
    ctx.fillStyle = '#ff5470';                    // 静音时画像素 X
    for (const [dx, dy] of [[-6,-6],[-3,-3],[0,0],[3,3],[-6,3],[-3,0],[0,-3],[3,-6]]) {
      ctx.fillRect(cx + dx, cy + dy, 3, 3);
    }
  }
}
function drawVolControls(y) {
  const r = volRects(y);
  curVolRects = r;
  drawText('音量', r.label.x, r.label.y, 2, '#8b97b8');
  const b = r.bar;
  ctx.fillStyle = '#0d0f18'; ctx.fillRect(b.x - 2, b.y - 2, b.w + 4, b.h + 4);
  ctx.fillStyle = '#38405c'; ctx.fillRect(b.x, b.y, b.w, b.h);
  const fw = Math.round(b.w * (volMuted ? 0 : vol));
  if (fw > 0) {
    ctx.fillStyle = '#3f9e4e'; ctx.fillRect(b.x, b.y, fw, b.h);
    ctx.fillStyle = '#7fd18a'; ctx.fillRect(b.x, b.y, fw, 3);
  }
  ctx.fillStyle = '#141828';
  for (let i = 1; i < 4; i++) ctx.fillRect(b.x + b.w * i / 4 - 1, b.y, 2, b.h);
  const kx = b.x + fw;                            // 档位旋钮
  ctx.fillStyle = '#e8ecff';
  ctx.fillRect(kx - 3, b.y - 4, 6, b.h + 8);
  ctx.fillStyle = '#0d0f18';
  ctx.fillRect(kx - 3, b.y - 4, 6, 2);
  ctx.fillRect(kx - 3, b.y + b.h + 2, 6, 2);
  drawBtnRect(r.mute, hoverBtn === 'mute');       // 静音键
  drawSpeaker(r.mute, volMuted);
}

/* ================= 触屏虚拟方向键 ================= */
function drawArrow(b, dirName) {
  const rot = { up: 0, right: Math.PI / 2, down: Math.PI, left: -Math.PI / 2 }[dirName];
  ctx.save();
  ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
  ctx.rotate(rot);
  ctx.fillStyle = 'rgba(232,236,255,0.9)';
  ctx.fillRect(-9, -14, 18, 7);
  ctx.fillRect(-18, -7, 36, 7);
  ctx.fillRect(-9, 0, 18, 7);
  ctx.fillRect(-9, 7, 18, 7);
  ctx.restore();
}
function drawDPad() {
  for (const name of ['up', 'down', 'left', 'right']) {
    const b = dpad[name];
    ctx.fillStyle = dpadPressed === name ? 'rgba(56,64,92,0.55)' : 'rgba(24,28,46,0.38)';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = 'rgba(139,151,184,0.8)';
    ctx.fillRect(b.x, b.y, b.w, 4); ctx.fillRect(b.x, b.y, 4, b.h);
    ctx.fillStyle = 'rgba(13,15,24,0.8)';
    ctx.fillRect(b.x, b.y + b.h - 4, b.w, 4); ctx.fillRect(b.x + b.w - 4, b.y, 4, b.h);
    drawArrow(b, name);
  }
}

function isOutline(c, r) {
  return [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy]) => {
    const nc = c + dx, nr = r + dy;
    return nr < 0 || nr >= HEART.length || nc < 0 || nc >= HEART[0].length || HEART[nr][nc] === '0';
  });
}
function drawPixelHeart(x, y, s, filled) {
  for (let r = 0; r < HEART.length; r++) for (let c = 0; c < HEART[r].length; c++) {
    if (HEART[r][c] === '0') continue;
    const o = isOutline(c, r);
    let color = null;
    if (filled) color = ((c === 1 && r === 0) || (c === 5 && r === 0)) ? '#ffb8c4'
                         : (o ? '#3a1522' : '#ff5470');
    else if (o) color = '#2a1620';
    if (color) { ctx.fillStyle = color; ctx.fillRect(x + c * s, y + r * s, s, s); }
  }
}

/* ================= 场景绘制 ================= */
function drawHUD(t) {
  ctx.fillStyle = '#10131f'; ctx.fillRect(0, 0, W, HUD);
  ctx.fillStyle = '#0a0c14'; ctx.fillRect(0, 0, W, 4);
  ctx.fillStyle = '#2e3550'; ctx.fillRect(0, HUD - 4, W, 4);
  // 暂停按钮
  drawBtnRect(pauseBtn, hoverBtn === 'pause');
  const cx = pauseBtn.x + pauseBtn.w / 2, cy = pauseBtn.y + pauseBtn.h / 2;
  ctx.fillStyle = '#e8ecff';
  if (mode !== 'pause') {
    ctx.fillRect(cx - 8, cy - 10, 6, 20); ctx.fillRect(cx + 2, cy - 10, 6, 20);
  } else {
    ctx.fillRect(cx - 6, cy - 10, 3, 20); ctx.fillRect(cx - 3, cy - 8, 3, 16);
    ctx.fillRect(cx, cy - 6, 3, 12);      ctx.fillRect(cx + 3, cy - 4, 3, 8);
  }
  // 三颗像素爱心(页面最上方居中)
  const s = 8, hw = 7 * s, hh = 6 * s, gap = 10;
  let hx = (W - 3 * hw - 2 * gap) / 2;
  for (let i = 0; i < 3; i++) {
    let sc = 1;
    if (heartPop[i] && t - heartPop[i] < 260) sc = 1 + 0.5 * Math.sin((t - heartPop[i]) / 260 * Math.PI);
    ctx.save();
    ctx.translate(hx + hw / 2, HUD / 2);
    ctx.scale(sc, sc);
    drawPixelHeart(-hw / 2, -hh / 2, s, i < hp);
    ctx.restore();
    hx += hw + gap;
  }
  // 右上角: 得分 + 计时
  drawText('得分 ' + score, W - 16, 6, 2.5, '#ffd75e', 'right', true);
  drawText('时间 ' + fmtTime(timeMs), W - 16, 33, 2.5, '#e8ecff', 'right', true);
}

function drawGrid() {
  ctx.strokeStyle = '#1b2033'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 1; i < GRID; i++) {
    const p = i * CELL + 0.5;
    ctx.moveTo(p, HUD); ctx.lineTo(p, GRID_END);
    ctx.moveTo(0, HUD + p); ctx.lineTo(W, HUD + p);
  }
  ctx.stroke();
  ctx.strokeStyle = '#222940';
  ctx.beginPath();
  for (let i = 5; i < GRID; i += 5) {
    const p = i * CELL + 0.5;
    ctx.moveTo(p, HUD); ctx.lineTo(p, GRID_END);
    ctx.moveTo(0, HUD + p); ctx.lineTo(W, HUD + p);
  }
  ctx.stroke();
}

function drawWalls(t) {
  const glow = t - wallFxT < 400;   // 刚重布局时墙体整体变亮闪一下
  for (const key of walls) {
    const [x, y] = key.split(',').map(Number);
    const px = x * CELL, py = HUD + y * CELL;
    ctx.fillStyle = glow ? '#a9b3cc' : '#6e7891';
    ctx.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
    ctx.fillStyle = glow ? '#d5dcf0' : '#98a3bd';
    ctx.fillRect(px + 1, py + 1, CELL - 2, 3); ctx.fillRect(px + 1, py + 1, 3, CELL - 2);
    ctx.fillStyle = glow ? '#79839f' : '#454d63';
    ctx.fillRect(px + 1, py + CELL - 4, CELL - 2, 3); ctx.fillRect(px + CELL - 4, py + 1, 3, CELL - 2);
    ctx.fillStyle = glow ? '#5d6880' : '#303647'; ctx.fillRect(px + 4, py + 4, CELL - 8, CELL - 8);
    ctx.fillStyle = glow ? '#8d98b4' : '#7a849c';
    ctx.fillRect(px + 5, py + 8, CELL - 10, 2); ctx.fillRect(px + 8, py + 5, 2, CELL - 10);
  }
}

function drawSnake(t) {
  let alpha = 1;
  if (t < respawnUntil) alpha = ((t / 120) | 0) % 2 === 0 ? 0.85 : 0.25;
  ctx.save();
  ctx.globalAlpha = alpha;
  for (let i = snake.length - 1; i >= 1; i--) {
    const px = snake[i][0] * CELL, py = HUD + snake[i][1] * CELL;
    const alt = (snake[i][0] + snake[i][1]) % 2 === 0;
    ctx.fillStyle = alt ? '#f6d43a' : '#eac629';
    ctx.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
    ctx.fillStyle = alt ? '#fdf0a6' : '#f8e58a';
    ctx.fillRect(px + 1, py + 1, CELL - 2, 3);
    ctx.fillStyle = '#9a7a1a';
    ctx.fillRect(px + 1, py + CELL - 3, CELL - 2, 2);
  }
  const hx = snake[0][0] * CELL, hy = HUD + snake[0][1] * CELL;
  ctx.translate(hx + CELL / 2, hy + CELL / 2);
  ctx.rotate(Math.atan2(dir[1], dir[0]));
  if (headOk) ctx.drawImage(HEAD_SPRITE, -CELL / 2, -CELL / 2, CELL, CELL);
  else fallbackHead();
  ctx.restore();
}

function fallbackHead() {
  const h = CELL / 2;
  ctx.fillStyle = '#f6d43a'; ctx.fillRect(-h + 1, -h + 1, CELL - 2, CELL - 2);
  ctx.fillStyle = '#9a7a1a'; ctx.fillRect(-h + 1, h - 3, CELL - 2, 2);
  ctx.fillStyle = '#e8ecff';
  ctx.fillRect(-h + 3, -h + 5, 5, 5); ctx.fillRect(h - 8, -h + 5, 5, 5);
  ctx.fillStyle = '#141828';
  ctx.fillRect(-h + 4, -h + 6, 3, 3); ctx.fillRect(h - 7, -h + 6, 3, 3);
}
function fallbackFood(px, py) {
  const c = CELL;
  ctx.fillStyle = '#ff5470'; ctx.fillRect(px + 3, py + 4, c - 5, c - 7);
  ctx.fillStyle = '#ffb8c4'; ctx.fillRect(px + 5, py + 6, 4, 4);
  ctx.fillStyle = '#3f9e4e'; ctx.fillRect(px + c / 2 - 3, py, 6, 6);
}

function drawFood(t) {
  if (!food) return;
  const bob = ((t / 230) | 0) % 2 === 0 ? 0 : -1;
  const px = food.x * CELL, py = HUD + food.y * CELL + bob;
  if (foodOk) ctx.drawImage(FOOD_SPRITE, px, py, CELL, CELL);
  else fallbackFood(px, py);
}

function drawGreenEgg(t) {
  if (!greenEgg) return;
  const age = t - greenEgg.spawnT;
  let alpha = 1;
  if (age > GREEN_EGG_LIFE_MS - 1000) alpha = ((t / 150) | 0) % 2 === 0 ? 0.9 : 0.3;   // 消失前闪烁
  const bob = ((t / 230) | 0) % 2 === 0 ? 0 : -1;
  const px = greenEgg.x * CELL, py = HUD + greenEgg.y * CELL + bob;
  ctx.save();
  ctx.globalAlpha = alpha;
  if (foodOk) ctx.drawImage(greenFoodCanvas, px, py, CELL, CELL);
  else fallbackFoodGreen(px, py);
  ctx.restore();
}
function fallbackFoodGreen(px, py) {
  const c = CELL;
  ctx.fillStyle = '#3f9e4e'; ctx.fillRect(px + 3, py + 4, c - 5, c - 7);
  ctx.fillStyle = '#7fd18a'; ctx.fillRect(px + 5, py + 6, 4, 4);
  ctx.fillStyle = '#1d5226'; ctx.fillRect(px + c / 2 - 3, py, 6, 6);
}

function drawFx(t) {
  for (const f of fx) {
    const age = t - f.t0;
    if (age > 260) continue;
    const r = Math.floor(age / 260 * 9);
    const a = (0.9 - age / 260).toFixed(2);
    ctx.strokeStyle = (f.color || 'rgba(255,255,255,#A)').replace('#A', a);
    ctx.lineWidth = 2;
    ctx.strokeRect(f.x * CELL - r, HUD + f.y * CELL - r, CELL + 2 * r, CELL + 2 * r);
  }
}

function drawStart() {
  ctx.fillStyle = 'rgba(10,12,20,0.88)'; ctx.fillRect(0, 0, W, H);
  if (headOk) ctx.drawImage(HEAD_SPRITE, CX - 78, 84, 156, 156);
  else { ctx.save(); ctx.translate(CX, 162); ctx.scale(6, 6); fallbackHead(); ctx.restore(); }
  drawTextShadow('像素贪吃蛇', CX, 268, 4, '#ffd75e', 'center', true);
  drawBtn(startBtn, '开始游戏', 3, true, hoverBtn === 'start');
  drawText('方向键 / WASD 移动', CX, 486, 2, '#c8d2f0', 'center');
  drawText('吃到食物变长 · 撞墙损失生命', CX, 514, 2, '#c8d2f0', 'center');
  drawText('地图边缘传送 · 空格暂停游戏', CX, 542, 2, '#8b97b8', 'center');
  drawVolControls(582);
}
function drawPauseOverlay() {
  ctx.fillStyle = 'rgba(10,12,20,0.72)'; ctx.fillRect(0, 0, W, H);
  drawTextShadow('已暂停', CX, 330, 4, '#ffd75e', 'center', true);
  drawText('按 空格 或 点击任意位置继续', CX, 396, 2, '#c8d2f0', 'center');
  drawVolControls(468);
}
function drawOver() {
  ctx.fillStyle = 'rgba(10,12,20,0.85)'; ctx.fillRect(0, 0, W, H);
  drawTextShadow('游戏结束', CX, 296, 4, '#ff5470', 'center', true);
  drawText('得分 ' + score, CX, 372, 2, '#e8ecff', 'center');
  drawText('时间 ' + fmtTime(timeMs), CX, 400, 2, '#e8ecff', 'center');
  drawText('长度 ' + snake.length, CX, 428, 2, '#e8ecff', 'center');
  drawBtn(restartBtn, '重新开始', 3, true, hoverBtn === 'restart');
}

function fmtTime(ms) {
  const t = Math.floor(ms / 1000);
  const m = Math.floor(t / 60), s = t % 60;
  if (t >= 3600) {
    const h = Math.floor(t / 3600);
    return h + ':' + (m % 60 < 10 ? '0' : '') + (m % 60) + ':' + (s < 10 ? '0' : '') + s;
  }
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

/* ================= 主循环 ================= */
function frame(t) {
  const dt = Math.min(t - lastT, 100); lastT = t;
  if (mode === 'play') {
    timeMs += dt;
    if (t > respawnUntil) {
      acc += dt;
      while (acc >= TICK_MS) { acc -= TICK_MS; tick(); if (mode !== 'play') break; }
    }
    if (greenEgg) {                 // 绿色奶蛋: 4秒消失 / 0.3秒游走一格
      if (t - greenEgg.spawnT >= GREEN_EGG_LIFE_MS) greenEgg = null;
      else if (t - greenEgg.moveT >= GREEN_EGG_MOVE_MS) { greenEgg.moveT = t; moveGreenEgg(); }
    }
  }
  if (flash > 0) flash = Math.max(0, flash - dt / 300);
  draw(t);
  requestAnimationFrame(frame);
}

function draw(t) {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (t < shakeUntil) ctx.translate((Math.random() * 6 - 3) | 0, (Math.random() * 6 - 3) | 0);
  ctx.fillStyle = '#141828'; ctx.fillRect(0, HUD, W, GRID * CELL);
  drawGrid(); drawWalls(t); drawFood(t); drawGreenEgg(t); drawSnake(t); drawFx(t);
  ctx.restore();
  if (isTouch) {                        // 方向键独立区域(地图下方, 不遮挡视野)
    ctx.fillStyle = '#0d1019';
    ctx.fillRect(0, GRID_END, W, DPAD_H);
    ctx.fillStyle = '#2e3550';
    ctx.fillRect(0, GRID_END, W, 4);
  }
  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,60,60,' + (0.28 * flash).toFixed(2) + ')';
    ctx.fillRect(0, HUD, W, GRID * CELL);
  }
  if (isTouch && mode === 'play') drawDPad();
  if (mode === 'start') drawStart();
  else if (mode === 'pause') drawPauseOverlay();
  else if (mode === 'over') drawOver();
  drawHUD(t);   // 顶部状态栏最后绘制, 爱心/计时/暂停按钮任何界面都可见
}

/* ================= 输入 ================= */
function getPos(e) {
  const r = canvas.getBoundingClientRect();
  // 按画布实际显示尺寸换算成画布坐标, 页面缩放/手机手势缩放时也能点准
  return {
    x: (e.clientX - r.left) * (W / r.width),
    y: (e.clientY - r.top) * (H / r.height),
  };
}
function inRect(p, b) { return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h; }

window.addEventListener('keydown', e => {
  if (e.code in KEYMAP) {
    e.preventDefault();
    pushDir(DIRS[KEYMAP[e.code]]);
  } else if (e.code === 'Space' || e.code === 'KeyP') {
    e.preventDefault();
    if (mode === 'play') pauseGame();
    else if (mode === 'pause') resumeGame();
  } else if (e.code === 'Enter') {
    if (mode === 'start') startGame();
    else if (mode === 'over') restartGame();
  }
});
function inBarHit(p) {   // 音量条命中区域(上下各加 6px 方便点击)
  const b = curVolRects.bar;
  return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y - 6 && p.y <= b.y + b.h + 6;
}
canvas.addEventListener('mousemove', e => {
  const p = getPos(e);
  hoverBtn = null;
  if (mode === 'start') {
    if (inRect(p, startBtn)) hoverBtn = 'start';
    else if (curVolRects && inRect(p, curVolRects.mute)) hoverBtn = 'mute';
  } else if (mode === 'over') {
    if (inRect(p, restartBtn)) hoverBtn = 'restart';
  } else if (mode === 'play') {
    if (inRect(p, pauseBtn)) hoverBtn = 'pause';
  } else if (mode === 'pause') {
    if (inRect(p, pauseBtn)) hoverBtn = 'pause';
    else if (curVolRects && inRect(p, curVolRects.mute)) hoverBtn = 'mute';
  }
  canvas.style.cursor = hoverBtn ? 'pointer' : 'default';
});
canvas.addEventListener('click', e => {
  if (Date.now() < suppressClickUntil) return;   // 滑动转向后屏蔽随之而来的 click
  const p = getPos(e);
  const vr = curVolRects;
  if (mode === 'start') {
    if (vr && inRect(p, vr.mute)) toggleMute();
    else if (vr && inBarHit(p)) setVolFromX(p.x);
    else if (inRect(p, startBtn)) startGame();
  } else if (mode === 'over') {
    if (inRect(p, restartBtn)) restartGame();
  } else if (mode === 'play') {
    if (inRect(p, pauseBtn)) pauseGame();
  } else if (mode === 'pause') {
    if (vr && inRect(p, vr.mute)) toggleMute();
    else if (vr && inBarHit(p)) setVolFromX(p.x);
    else resumeGame();
  }
});

/* ================= 指针/触屏输入(统一鼠标与手指: 滑动转向+虚拟方向键+按钮) ================= */
function handleTap(p) {   // 按钮在按下瞬间响应, 不依赖 click 合成事件
  const vr = curVolRects;
  if (mode === 'start') {
    if (inRect(p, startBtn)) { suppressClickUntil = Date.now() + 600; startGame(); }
    else if (vr && inRect(p, vr.mute)) { suppressClickUntil = Date.now() + 600; toggleMute(); }
    else if (vr && inBarHit(p)) { suppressClickUntil = Date.now() + 600; setVolFromX(p.x); }
  } else if (mode === 'over') {
    if (inRect(p, restartBtn)) { suppressClickUntil = Date.now() + 600; restartGame(); }
  } else if (mode === 'play') {
    if (inRect(p, pauseBtn)) { suppressClickUntil = Date.now() + 600; pauseGame(); }
    if (isTouch && dpad) {
      for (const name of ['up', 'down', 'left', 'right']) {
        if (inRect(p, dpad[name])) { pushDir(DIRS[name]); dpadPressed = name; }
      }
    }
  } else if (mode === 'pause') {
    if (inRect(p, pauseBtn)) { suppressClickUntil = Date.now() + 600; resumeGame(); }
    else if (vr && inRect(p, vr.mute)) { suppressClickUntil = Date.now() + 600; toggleMute(); }
    else if (vr && inBarHit(p)) { suppressClickUntil = Date.now() + 600; setVolFromX(p.x); }
    else resumeOnUp = true;                    // 轻抬手指再继续, 避免滑动误触发
  }
}
function endGesture(x, y) {
  dpadPressed = null;
  if (!ptrDown) return;
  const dx = x - ptrDown.x, dy = y - ptrDown.y;
  ptrDown = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) {
    if (resumeOnUp && mode === 'pause') { resumeOnUp = false; resumeGame(); }
    return;                                    // 轻点已由 handleTap/click 处理
  }
  resumeOnUp = false;
  if (mode === 'play') {                       // 滑动转向
    suppressClickUntil = Date.now() + 500;
    const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? DIRS.right : DIRS.left)
                                          : (dy > 0 ? DIRS.down : DIRS.up);
    pushDir(d);
  }
}
if (window.PointerEvent) {
  // 现代浏览器(含 iPhone Safari 13+ 与微信 WKWebView): 指针事件统一处理鼠标与触屏
  canvas.addEventListener('pointerdown', e => {
    if (!e.isPrimary) return;
    ptrDown = { x: e.clientX, y: e.clientY };
    handleTap(getPos(e));
  });
  canvas.addEventListener('pointerup', e => {
    if (!e.isPrimary) return;
    endGesture(e.clientX, e.clientY);
  });
  canvas.addEventListener('pointercancel', () => { ptrDown = null; dpadPressed = null; resumeOnUp = false; });
} else {
  // 老旧浏览器回退: 触摸事件
  canvas.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    ptrDown = { x: t.clientX, y: t.clientY };
    handleTap(getPos(t));
  });
  canvas.addEventListener('touchend', e => {
    const t = e.changedTouches[0];
    endGesture(t.clientX, t.clientY);
  });
  canvas.addEventListener('touchcancel', () => { ptrDown = null; dpadPressed = null; resumeOnUp = false; });
}

/* ================= 启动 ================= */
initWorld();
lastT = performance.now();
requestAnimationFrame(frame);
</script>
</body>
</html>
